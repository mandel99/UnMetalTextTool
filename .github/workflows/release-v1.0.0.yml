name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build
        shell: cmd
        run: msbuild UnMetalTextTool.csproj /restore /p:Configuration=Release

      - name: Package
        id: package
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "dev"
          }

          $packageDir = Join-Path $env:GITHUB_WORKSPACE "package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "bin\Release\net48\UnMetalTextTool.exe" $packageDir

          if (Test-Path "bin\Release\net48\UnMetalTextTool.exe.config") {
            Copy-Item "bin\Release\net48\UnMetalTextTool.exe.config" $packageDir
          }

          $zipName = "UnMetalTextTool-$version.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipName -Force

          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnMetalTextTool
          path: ${{ steps.package.outputs.zip_name }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "${{ steps.package.outputs.zip_name }}" `
            --target "$env:GITHUB_SHA" `
            --title "UnMetal Text Tool $env:GITHUB_REF_NAME" `
            --generate-notes
